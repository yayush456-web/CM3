plugins {
    id "com.android.application"
}

android {
    namespace "com.commando3.mobile"
    compileSdk 34

    defaultConfig {
        applicationId "com.commando3.mobile"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
